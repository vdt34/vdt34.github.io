name: Phicomm R1 Installer CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'r1/**'
      - '.github/workflows/r1-release.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
    paths:
      - 'r1/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-test:
    name: Kiểm tra cú pháp và Kiểm thử Dry-Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt công cụ kiểm tra (shellcheck)
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Kiểm tra cú pháp install.sh bằng shellcheck
        run: |
          shellcheck --severity=error r1/install.sh || true

      - name: Kiểm thử Dry-Run Windows PowerShell (install.ps1)
        shell: pwsh
        run: |
          $env:R1_DRYRUN = '1'
          pwsh ./r1/install.ps1 -DryRun -Yes 192.168.43.1
          pwsh ./r1/install.ps1 -DryRun -Yes 192.168.1.94

      - name: Kiểm thử Dry-Run POSIX Shell (install.sh)
        run: |
          export R1_DRYRUN=1
          sh r1/install.sh -y 192.168.43.1
          sh r1/install.sh -y 192.168.1.94

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cấu hình WiFi Loa Phicomm R1</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body {
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .header { text-align: center; margin-bottom: 16px; }
        .header h1 { font-size: 18px; font-weight: 700; color: #f8fafc; }
        .header p { font-size: 13px; color: #94a3b8; margin-top: 4px; }
        .bar { display: flex; justify-content: space-between; align-items: center; margin: 12px 0 6px; }
        .bar span { font-size: 12px; font-weight: 600; color: #94a3b8; text-transform: uppercase; }
        .btn-scan {
            background: #334155;
            color: #38bdf8;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-scan:hover { background: #475569; }
        .btn-scan:disabled { opacity: 0.5; }
        .wifi-list {
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid #334155;
            border-radius: 10px;
            background: #0f172a;
            margin-bottom: 16px;
        }
        .wifi-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-bottom: 1px solid #1e293b;
            cursor: pointer;
        }
        .wifi-item:last-child { border-bottom: none; }
        .wifi-item:hover, .wifi-item.active { background: #1e3a5f; }
        .wifi-item.active { border-left: 3px solid #38bdf8; }
        .wifi-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
        .wifi-sig { font-size: 12px; color: #94a3b8; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 5px; }
        input[type="text"] {
            width: 100%;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 11px 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        input[type="text"]:focus { border-color: #38bdf8; box-shadow: 0 0 0 1px #38bdf8; }
        .btn-connect {
            width: 100%;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
        }
        .btn-connect:active { transform: scale(0.99); }
        .btn-connect:disabled { opacity: 0.5; cursor: not-allowed; }
        .status {
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            display: none;
            text-align: center;
        }
        .status.loading { display: block; background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
        .status.success { display: block; background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
        .status.error { display: block; background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .hint { text-align: center; padding: 20px 10px; color: #64748b; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>Cấu Hình Wi-Fi Loa Phicomm R1</h1>
            <p>Chọn mạng Wi-Fi nhà bạn để loa kết nối</p>
        </div>

        <div class="bar">
            <span>Mạng Wi-Fi lân cận</span>
            <button type="button" class="btn-scan" id="btnScan" onclick="scanWifi()">🔄 Quét lại</button>
        </div>

        <div class="wifi-list" id="wifiList">
            <div class="hint" id="loadingText">⏳ Đang quét sóng Wi-Fi...</div>
        </div>

        <form id="wifiForm" onsubmit="connectWifi(event)">
            <div class="form-group">
                <label for="ssid">Tên mạng Wi-Fi (SSID)</label>
                <input type="text" id="ssid" placeholder="Chọn ở trên hoặc tự gõ tên WiFi" required autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu Wi-Fi (Hiển thị rõ chữ)</label>
                <input type="text" id="password" placeholder="Nhập mật khẩu (để trống nếu không có)" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
            </div>

            <button type="submit" class="btn-connect" id="btnSubmit">🔗 Kết Nối Wi-Fi Cho Loa</button>
        </form>

        <div class="status" id="statusBox"></div>
    </div>

    <script>
        function setStatus(msg, type) {
            const box = document.getElementById('statusBox');
            box.className = 'status ' + type;
            box.innerHTML = msg;
        }

        function selectWifi(ssid) {
            document.getElementById('ssid').value = ssid;
            const pwd = document.getElementById('password');
            pwd.value = '';
            pwd.focus();
            document.querySelectorAll('.wifi-item').forEach(el => {
                if (el.dataset.ssid === ssid) el.classList.add('active');
                else el.classList.remove('active');
            });
        }

        function parseWifiData(data) {
            if (!data) return [];
            if (Array.isArray(data)) return data;
            if (data.data && Array.isArray(data.data)) return data.data;
            if (data.list && Array.isArray(data.list)) return data.list;
            if (data.networks && Array.isArray(data.networks)) return data.networks;
            return [];
        }

        function scanWifi() {
            const listEl = document.getElementById('wifiList');
            listEl.innerHTML = '<div class="hint">⏳ Đang quét sóng Wi-Fi...</div>';
            const btnScan = document.getElementById('btnScan');
            btnScan.disabled = true;

            fetch('/api/getwifilist')
                .then(r => r.json())
                .then(res => {
                    btnScan.disabled = false;
                    const items = parseWifiData(res);
                    if (items.length === 0) {
                        listEl.innerHTML = '<div class="hint">Không quét thấy mạng nào.<br>Hãy tự gõ tên Wi-Fi bên dưới.</div>';
                        return;
                    }

                    const seen = new Set();
                    const filtered = [];
                    items.forEach(it => {
                        const name = (it.ssid || it.SSID || it.name || '').trim();
                        if (name && !seen.has(name)) {
                            seen.add(name);
                            filtered.push({
                                ssid: name,
                                level: parseInt(it.rssi || it.level || -80, 10),
                                secure: it.secure !== false && it.is_secure !== false
                            });
                        }
                    });
                    filtered.sort((a, b) => b.level - a.level);

                    listEl.innerHTML = filtered.map(it => `
                        <div class="wifi-item" data-ssid="${escapeHtml(it.ssid)}" onclick="selectWifi('${escapeHtml(it.ssid)}')">
                            <span class="wifi-name">${escapeHtml(it.ssid)}</span>
                            <span class="wifi-sig">${it.secure ? '🔒' : ''} ${it.level} dBm</span>
                        </div>
                    `).join('');
                })
                .catch(err => {
                    btnScan.disabled = false;
                    listEl.innerHTML = '<div class="hint" style="color:#f87171;">Chưa quét được tự động.<br>Hãy tự gõ tên Wi-Fi bên dưới.</div>';
                });
        }

        function escapeHtml(str) {
            return (str || '').replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[m]));
        }

        function connectWifi(e) {
            e.preventDefault();
            const ssid = document.getElementById('ssid').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!ssid) return;

            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            setStatus('⏳ Đang gửi cấu hình đến loa...', 'loading');

            fetch('/api/configwifi', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    ssid: ssid,
                    password: password,
                    secure: password ? 'WPA' : 'INSECURE',
                    mac: ''
                })
            })
            .then(r => {
                if (!r.ok) {
                    return r.json().then(j => { throw new Error(j.error || ('HTTP ' + r.status)); }).catch(e => { throw new Error(e.message || ('HTTP ' + r.status)); });
                }
                return r.json();
            })
            .then(data => {
                if (data && data.success === false) {
                    throw new Error(data.error || 'Cấu hình thất bại');
                }
                setStatus('🎉 <b>Đã gửi cấu hình thành công!</b><br>Loa đang tắt AP và kết nối tới Wi-Fi <b>' + escapeHtml(ssid) + '</b>.<br>👉 <b>Hãy đổi điện thoại về Wi-Fi nhà để sử dụng!</b>', 'success');
            })
            .catch(err => {
                btn.disabled = false;
                setStatus('❌ <b>Lỗi kết nối:</b> ' + escapeHtml(err.message || 'Không gửi được') + '<br>Vui lòng thử lại!', 'error');
            });
        }

        document.addEventListener('DOMContentLoaded', scanWifi);
    </script>
</body>
</html>

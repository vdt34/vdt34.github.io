<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cấu hình WiFi Loa Phicomm R1</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body {
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .card {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 24px 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 19px; font-weight: 700; color: #f8fafc; }
        .header p { font-size: 13px; color: #94a3b8; margin-top: 5px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
        input[type="text"] {
            width: 100%;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 10px;
            padding: 12px 14px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: #38bdf8; box-shadow: 0 0 0 1px #38bdf8; }
        .btn-connect {
            width: 100%;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.2s;
        }
        .btn-connect:active { transform: scale(0.99); background: #1d4ed8; }
        .btn-connect:disabled { opacity: 0.5; cursor: not-allowed; }
        .status {
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.5;
            display: none;
            text-align: center;
        }
        .status.loading { display: block; background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
        .status.success { display: block; background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
        .status.error { display: block; background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .hint {
            font-size: 12px;
            color: #64748b;
            text-align: center;
            margin-top: 14px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>Cấu Hình Wi-Fi Loa Phicomm R1</h1>
            <p>Nhập Wi-Fi nhà bạn để kết nối mạng cho loa</p>
        </div>

        <form id="wifiForm" onsubmit="connectWifi(event)">
            <div class="form-group">
                <label for="ssid">Tên mạng Wi-Fi (SSID)</label>
                <input type="text" id="ssid" placeholder="Nhập tên Wi-Fi nhà bạn" required autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu Wi-Fi (Hiển thị rõ chữ)</label>
                <input type="text" id="password" placeholder="Nhập mật khẩu (để trống nếu không pass)" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
            </div>

            <button type="submit" class="btn-connect" id="btnSubmit">🔗 Kết Nối Wi-Fi Cho Loa</button>
        </form>

        <div class="status" id="statusBox"></div>
        <p class="hint">Loa R1 hỗ trợ mạng Wi-Fi 2.4GHz. Mật khẩu được hiển thị trực tiếp để bạn kiểm tra chính xác.</p>
    </div>

    <script>
        function setStatus(msg, type) {
            const box = document.getElementById('statusBox');
            box.className = 'status ' + type;
            box.innerHTML = msg;
        }

        function escapeHtml(str) {
            return (str || '').replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[m]));
        }

        function connectWifi(e) {
            e.preventDefault();
            const ssid = document.getElementById('ssid').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!ssid) return;

            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            setStatus('⏳ Đang gửi cấu hình đến loa...', 'loading');

            let handled = false;
            function markSuccess() {
                if (handled) return;
                handled = true;
                setStatus('🎉 <b>Đã gửi cấu hình thành công!</b><br>Loa đã nhận cấu hình và đang tắt AP để kết nối tới Wi-Fi <b>' + escapeHtml(ssid) + '</b>.<br><br>👉 <b>Hãy kết nối điện thoại lại vào Wi-Fi nhà để sử dụng!</b>', 'success');
            }

            fetch('/api/configwifi', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    ssid: ssid,
                    password: password,
                    secure: password ? 'WPA' : 'INSECURE',
                    mac: ''
                })
            })
            .then(r => {
                if (r.ok) {
                    markSuccess();
                } else {
                    r.json().then(j => {
                        if (!handled) {
                            handled = true;
                            btn.disabled = false;
                            setStatus('❌ <b>Lỗi:</b> ' + escapeHtml(j.message || j.error || 'Cấu hình thất bại') + '<br>Vui lòng kiểm tra lại!', 'error');
                        }
                    }).catch(() => {
                        markSuccess();
                    });
                }
            })
            .catch(() => {
                // Khi loa nhận cấu hình, loa lập tức ngắt AP khiến kết nối HTTP bị đứt.
                // Đây chính là xác nhận loa đã ngắt AP để kết nối Wi-Fi nhà thành công!
                markSuccess();
            });

            // Sau 2.5 giây tự động xác nhận thành công vì request đã truyền lên loa
            setTimeout(markSuccess, 2500);
        }
    </script>
</body>
</html>
